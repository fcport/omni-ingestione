name: Ingestione feed

# Popola Notizie ed Eventi di Omni dalle Fonti sammarinesi.
#
# PERCHÉ QUESTO REPO È PUBBLICO. Le GitHub Actions sono illimitate sui repo
# pubblici e contate su quelli privati. Dal 21 al 31 luglio 2026 l'ingestione è
# rimasta ferma **undici giorni** perché i 2.000 minuti del piano privato erano
# esauriti: i job non partivano nemmeno, l'app mostrava notizie ferme e nessuno
# se n'è accorto finché il contatore non si è azzerato da solo il 1° agosto.
# Qui quel guasto non può ripetersi.
#
# CADENZA ogni ora, di giorno. Sul privato erano due ore per risparmiare minuti;
# qui il vincolo non c'è, e la freschezza conta: i feed delle testate espongono
# solo 20-25 articoli, quindi una giornata prolifica scorre via fra un giro e
# l'altro e quello che è uscito nel mezzo è perso per sempre. La notte resta
# ferma perché nessuno pubblica alle 3.
#
# Niente Flutter: è un progetto Dart puro, l'SDK si tira su in pochi secondi.

# L'OROLOGIO NON È PIÙ QUESTO. Dal 2026-08-03 a scandire l'ingestione è pg_cron
# su Supabase (`innesca_ingestione`, al minuto :05), che lancia il workflow via
# `workflow_dispatch`: i lanci su richiesta partono subito, i job schedulati no.
# La schedulazione di GitHub è best-effort e lo dice la documentazione — dei
# quattro giri previsti fra le 07:37 e le 10:37 del 2026-08-03 ne era partito
# **uno solo**, con 19 minuti di ritardo.
#
# QUESTO CRON È LA RISERVA, E VA TENUTA RADA (2026-08-05). Quando l'orologio si
# è spostato su Supabase, questo `schedule` orario è rimasto acceso: due giri
# ogni ora invece di uno, il doppio delle richieste alle testate. Il giorno dopo
# Libertas e RTV hanno iniziato a rispondere 403 ai runner — e la migrazione che
# ha spostato l'orologio lo aveva già scritto, che ogni giro in più è una
# richiesta in più a chi risponde 403 quando gli si bussa troppo spesso.
#
# Quattro giri al giorno bastano a coprire il caso «Supabase ha smesso di
# innescare» senza raddoppiare il traffico: il buco massimo diventa quattro ore,
# che è la stessa soglia oltre la quale il guardiano su Supabase notifica gli
# admin. Se l'innesco si rompe, lo si sa da lì — non da questo cron.
on:
  schedule:
    - cron: '37 6,10,14,18 * * *'
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Ingestione
        env:
          # L'host non è un segreto; il token sì, ed è l'unica cosa che questo
          # repo conosce del database.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: bash tool/ingest_all.sh
