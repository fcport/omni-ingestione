name: Ingestione istituzionale

# Popola `documento_istituzionale` dalle Fonti istituzionali: è la base di
# conoscenza che Omni-AI cita al cittadino quando gli si chiede di un atto o di
# un comunicato.
#
# GIORNALIERO (02:43 UTC). Era settimanale, con la motivazione che gli atti
# cambiano lentamente: vera per il singolo atto, sbagliata per l'indice. Il
# selettore prende al massimo `config.max` link (40 sugli Atti normativi) dalla
# prima pagina, e la finestra non aspetta noi: se in una settimana il Congresso
# ne pubblica più di 40, quelli in fondo escono dall'indice e non entrano MAI —
# nessun errore, nessuna riga rossa, solo un buco nella base di conoscenza che
# Omni-AI cita. Il giro costa 3m36s e ~43 richieste a gov.sm: girare ogni notte
# ne fa meno di quante il feed ne fa alle testate in un'ora.
#
# Resta lontano dal feed orario (fascia 05:05-21:05) e dai Bandi (03:17): i cron
# di GitHub slittano anche di un'ora, e 02:43 lascia margine a tutti. Mai il
# minuto :00, che è il più affollato della coda e viene saltato nei picchi.
#
# L'ingestione è idempotente sull'URL (`dedup_key`), quindi ri-crawlare ogni
# notte le stesse pagine non duplica niente: le pagine di dettaglio si
# ri-scaricano comunque tutte, il dedup è a valle.
#
# ⚠️ QUESTO JOB È GIÀ MORTO IN SILENZIO UNA VOLTA. Dal 13 luglio al 4 agosto
# 2026 è fallito ogni settimana: l'indice del Congresso di Stato rispondeva 404
# (pagina spostata), lo script girava sotto `set -e` senza tolleranza per Fonte,
# e moriva prima ancora di provare il Consiglio Grande e Generale. Risultato:
# `documento_istituzionale` a zero righe per tre settimane, con l'assistente che
# non aveva nulla da citare. Ora ogni Fonte lascia una riga in
# `ingestione_esito` (tipo='istituzionale') anche quando fallisce, e una Fonte
# rotta non ferma le altre.
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: ingest-istituzionale
  cancel-in-progress: true

jobs:
  ingest-istituzionale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Ingestione istituzionale
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: bash tool/ingest_istituzionale.sh
